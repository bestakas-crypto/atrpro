<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>입금기록</title>
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/withdrawals.css" />
</head>
<body>

<div class="wd-toolbar">
  <button id="btn-close" class="btn btn-secondary" aria-label="닫기">← 닫기</button>
  <span class="wd-toolbar-title">입금기록</span>
  <a href="withdrawals.html" class="btn btn-secondary" style="text-decoration:none;">출금기록</a>
  <button id="btn-export-csv" class="btn btn-secondary" aria-label="CSV 내보내기">CSV</button>
</div>

<main id="wd-root">

  <div class="wd-header-row">
    <h2>현금 입금 장부</h2>
    <button id="btn-add-withdrawal" class="btn btn-primary">+ 입금 추가</button>
  </div>

  <p class="wd-hint" style="padding: 0 4px 8px;">
    급여·상여금처럼 <b>총자산 밖에서 새로 들어온 돈</b>만 "외부입금"으로 기록하세요.
    예금계좌 사이 이체나 증권계좌로의 매수자금 이동은 "내부이체"로 남기면
    analyze.kunoh.top의 수익률 계산에서 자동으로 제외됩니다.
  </p>

  <!-- 2. 기간별 요약 카드 -->
  <div class="wd-summary-grid">
    <div class="wd-summary-card"><div class="label">오늘</div><div class="amounts" id="summary-today"></div></div>
    <div class="wd-summary-card"><div class="label">이번 주</div><div class="amounts" id="summary-this_week"></div></div>
    <div class="wd-summary-card"><div class="label">이번 달</div><div class="amounts" id="summary-this_month"></div></div>
    <div class="wd-summary-card"><div class="label">올해(YTD)</div><div class="amounts" id="summary-ytd"></div></div>
  </div>

  <!-- 3. 출처 검색 -->
  <div class="wd-search-row">
    <input id="search-purpose" type="text" inputmode="search" placeholder="출처로 검색 (예: 급여, 상여금)" />
  </div>
  <div id="recent-purposes" class="wd-recent-purposes"></div>

  <!-- 4. 필터 -->
  <div class="wd-filter-bar">
    <div class="field-group">
      <label for="filter-start-date">시작일</label>
      <input id="filter-start-date" type="date" />
    </div>
    <div class="field-group">
      <label for="filter-end-date">종료일</label>
      <input id="filter-end-date" type="date" />
    </div>
    <div class="field-group">
      <label for="filter-account">입금계좌</label>
      <select id="filter-account"><option value="">전체</option></select>
    </div>
    <div class="field-group">
      <label for="filter-currency">통화</label>
      <select id="filter-currency">
        <option value="">전체</option>
        <option value="KRW">KRW</option>
        <option value="USD">USD</option>
        <option value="JPY">JPY</option>
      </select>
    </div>
    <div class="field-group">
      <label for="filter-flow-type">구분</label>
      <select id="filter-flow-type">
        <option value="">전체</option>
        <option value="EXTERNAL">외부입금</option>
        <option value="INTERNAL_TRANSFER">내부이체</option>
      </select>
    </div>
    <div class="wd-filter-actions">
      <button id="btn-apply-filter" class="btn btn-primary btn-block">필터 적용</button>
      <button id="btn-reset-filter" class="btn btn-secondary btn-block">초기화</button>
    </div>
  </div>

  <!-- 5. 검색 결과 건수 + 통화별/계좌별 합계 -->
  <div class="wd-result-summary">
    <div class="count" id="result-count"></div>
    <div class="amounts" id="result-sum"></div>
    <button id="btn-toggle-account-breakdown" class="wd-account-toggle" hidden>계좌별 합계 보기 ▾</button>
    <div id="account-breakdown" class="wd-account-breakdown"></div>
  </div>

  <!-- 6. 목록 -->
  <div id="wd-list" class="wd-list"></div>
  <p id="wd-empty" class="wd-empty" hidden>입금기록이 없습니다.</p>

  <button id="btn-load-more" class="btn btn-secondary btn-block wd-load-more" hidden>더 보기</button>

</main>

<!-- 등록/수정 모달 -->
<div id="modal-withdrawal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3 id="modal-withdrawal-title">입금 추가</h3>

    <div id="no-account-hint" class="wd-account-hint" hidden>
      등록된 예금계좌가 없습니다. 먼저 예금관리에서 계좌를 등록해 주세요.
      <br /><a href="index.html">예금관리로 이동</a>
    </div>

    <div class="field-group">
      <label for="wd-account">입금계좌</label>
      <select id="wd-account"></select>
    </div>
    <div class="field-group">
      <label for="wd-withdrawn-at">입금 일시</label>
      <input id="wd-withdrawn-at" type="datetime-local" />
    </div>
    <div class="field-group">
      <label for="wd-purpose">출처</label>
      <input id="wd-purpose" type="text" maxlength="100" placeholder="예: 급여" />
    </div>
    <div class="field-group">
      <label for="wd-amount">입금액</label>
      <input id="wd-amount" type="number" inputmode="decimal" min="0" step="0.01" />
    </div>
    <div class="field-group">
      <label for="wd-currency">통화</label>
      <select id="wd-currency">
        <option value="KRW">KRW</option>
        <option value="USD">USD</option>
        <option value="JPY">JPY</option>
      </select>
    </div>
    <div class="field-group">
      <label for="wd-flow-type">구분</label>
      <select id="wd-flow-type">
        <option value="EXTERNAL">외부입금 (급여 등 새로 들어온 돈)</option>
        <option value="INTERNAL_TRANSFER">내부이체 (계좌 간 이동, 총자산 불변)</option>
      </select>
    </div>
    <div class="field-group">
      <label for="wd-memo">메모 (선택)</label>
      <textarea id="wd-memo" maxlength="500"></textarea>
    </div>

    <div class="modal-actions">
      <button id="btn-withdrawal-cancel" class="btn btn-secondary btn-block">취소</button>
      <button id="btn-withdrawal-save" class="btn btn-primary btn-block">저장</button>
    </div>
  </div>
</div>

<!-- 삭제 확인 모달 -->
<div id="modal-delete-confirm" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>입금기록 삭제</h3>
    <div class="modal-message">
      이 입금기록을 삭제합니다. 이 작업은 되돌릴 수 없습니다.
      <dl id="delete-confirm-detail"></dl>
    </div>
    <div class="modal-actions">
      <button id="btn-delete-cancel" class="btn btn-secondary btn-block">취소</button>
      <button id="btn-delete-confirm" class="btn btn-danger btn-block">삭제</button>
    </div>
  </div>
</div>

<!-- 일반 확인 모달(저장 확인/중복 경고 공용) -->
<div id="modal-confirm" class="modal-overlay" hidden>
  <div class="modal-box">
    <p id="confirm-message" class="modal-message"></p>
    <div class="modal-actions">
      <button id="btn-confirm-cancel" class="btn btn-secondary btn-block">취소</button>
      <button id="btn-confirm-ok" class="btn btn-primary btn-block">확인</button>
    </div>
  </div>
</div>

<div id="toast" class="wd-hint" hidden style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14181f;color:#fff;padding:10px 16px;border-radius:8px;z-index:200;"></div>

<script type="module" src="js/cash-inflows.js"></script>
</body>
</html>
