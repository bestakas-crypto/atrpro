# ATRsite-pro nginx reverse proxy -- 스펙 14.1 "동일 출처" 원칙대로 프런트엔드
# 정적 파일도 같은 FastAPI 프로세스(atrsite-web.service, 127.0.0.1:8000)가
# 서빙하므로, nginx는 도메인/포트80 진입점 역할만 한다.
#
# 설치: /etc/nginx/sites-available/atrsite 로 복사 후
#   sudo ln -sf /etc/nginx/sites-available/atrsite /etc/nginx/sites-enabled/atrsite
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
# HTTPS가 필요하면 certbot 등으로 이 파일 위에 443 서버 블록을 추가할 것
# (2026-08-02 RackNerd VPS 배포 시점에는 도메인이 없어 HTTP만 설정함).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
