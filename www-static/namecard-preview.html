  :root {
    --card-bg: #ffffff;
    --card-text: #111111;
    --card-muted: #5a5a5a;
    --page-bg: #eeece2;
    --page-ink: #23251f;
    --page-muted: #6f7267;
    --shadow: rgba(20, 22, 18, 0.28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-bg: #1b1d19;
      --page-ink: #d9dbd2;
      --page-muted: #9a9d92;
      --shadow: rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #1b1d19;
    --page-ink: #d9dbd2;
    --page-muted: #9a9d92;
    --shadow: rgba(0, 0, 0, 0.55);
  }
  :root[data-theme="light"] {
    --page-bg: #eeece2;
    --page-ink: #23251f;
    --page-muted: #6f7267;
    --shadow: rgba(20, 22, 18, 0.28);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--page-bg);
    color: var(--page-ink);
  }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    padding: 56px 24px 80px;
  }

  .stage {
    max-width: 1040px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .stage-head {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .eyebrow {
    font: 600 11px/1 "SFMono-Regular", Consolas, Menlo, monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--page-muted);
  }
  .stage-head h1 {
    margin: 0;
    font-size: clamp(22px, 3vw, 28px);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .spec {
    font: 12px/1.6 "SFMono-Regular", Consolas, Menlo, monospace;
    color: var(--page-muted);
  }

  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 48px;
    align-items: flex-start;
  }

  .card-wrap {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    width: 91mm;
    height: 55mm;
    background: var(--card-bg);
    color: var(--card-text);
    position: relative;
    box-shadow: 0 22px 46px var(--shadow), 0 2px 6px var(--shadow);
    border: 1px solid rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 8mm;
    font-family: "MSMinchoTrim", "Apple SD Gothic Neo", "Malgun Gothic",
      "Noto Sans KR", "MS Mincho", sans-serif;
  }

  .name-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .kanji {
    font-family: "MingLiUTrim", "PMingLiU", serif;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 0.05em;
    ruby-align: center;
  }
  .kanji rt {
    font-family: "MSMinchoTrim", "MS Mincho", sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--card-muted);
    opacity: 0.9;
  }

  .en-name {
    margin-top: 8px;
    font-family: "CenturyTrim", Century, Georgia, serif;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--card-muted);
  }

  .ko-name {
    font-family: "HYwulBTrim", "HY울릉도B", "Apple SD Gothic Neo", sans-serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.04em;
  }

  .divider {
    width: 30px;
    height: 1px;
    background: var(--card-text);
    opacity: 0.5;
    margin: 15px 0;
  }
  .card.back .divider {
    margin: 17px 0;
  }

  .contact {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-family: "SFMono-Regular", Consolas, Menlo, "Noto Sans Mono CJK KR", monospace;
    font-size: 9.5px;
    line-height: 1.55;
    letter-spacing: 0.01em;
    color: var(--card-muted);
    text-align: center;
  }
  .contact .primary {
    color: var(--card-text);
  }

  .card-wrap figcaption {
    display: flex;
    justify-content: space-between;
    font: 10px/1 "SFMono-Regular", Consolas, Menlo, monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--page-muted);
    width: 91mm;
  }

  @media (max-width: 720px) {
    .cards { gap: 36px; }
    .card, .card-wrap figcaption { width: 100%; max-width: 91mm; }
  }
</style>
</head>

    </div>

    <div class="cards">

  </div>
